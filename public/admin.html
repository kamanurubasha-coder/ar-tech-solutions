<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | AR TECH SOLUTIONS</title>
    <meta name="description" content="Admin login for AR TECH SOLUTIONS enquiry dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <div class="admin-container">
      <div class="login-form">
        <h2>AR TECH SOLUTIONS Admin</h2>
        <form id="adminLoginForm">
          <input type="text" id="adminUsername" value="admin" readonly />
          <input type="password" id="adminPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>
        <p id="adminStatus" class="form-status"></p>
      </div>
    </div>

    <script src="/js/script.js"></script>
  </body>
</html>
